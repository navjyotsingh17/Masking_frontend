apiVersion: apps/v1

kind: Deployment

metadata:
  name: masking-frontend-deployment
  labels:
    app.kubernetes.io/name: masking-frontend-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 10
  
  selector:
    matchLabels:
      app.kubernetes.io/name: masking-frontend
  
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masking-frontend # Selector label in service.yml should match this label
  
    spec:
      serviceAccountName: aadhaar-masking  
      containers:
      - name: masking-frontend
        image: navjyotsinghpulaha/masking_frontend:11-oct-2026
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: service

        env:
        - name: MASKING_API_URL
          value: "http://masking-engine-service:5000/api/mask"
        - name: MASKING_API_PASSWORD
          valueFrom:
              secretKeyRef:
                name: masking-api-password-for-nextjs-app
                key: password

        resources:
          requests:
            memory: "521Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
          volumeMounts:
      volumes:
    

  
